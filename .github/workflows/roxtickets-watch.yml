name: roxtickets-watch
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: roxtickets-watch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Check listings
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ROX_TOKEN: ${{ secrets.ROX_TOKEN }}
        run: node roxtickets-watch.js
      - name: Save state
        run: |
          git config user.name "roxtickets-watch bot"
          git config user.email "actions@github.com"
          git add state.json
          # Nothing changed -> nothing to push. Most runs end here, so a GitHub
          # blip can't fail the job.
          if git diff --staged --quiet; then echo "state unchanged"; exit 0; fi
          git commit -m "update state"
          # Retry a few times in case of a brief GitHub hiccup or a newer commit.
          for i in 1 2 3; do
            git push && exit 0
            echo "push attempt $i failed, retrying"
            sleep $((i * 10))
            git pull --rebase || true
          done
          echo "could not save state.json after 3 tries"
          exit 1
